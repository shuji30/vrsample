# GitHub Pages に静的サイトとして公開する。
# 使うにはリポジトリの Settings > Pages で Source を "GitHub Actions" にする。
#
# 作る（アーティファクトを上げる）手順と、公開する手順を、別のジョブに分ける（GitHub 公式のひな形と同じ形）。
# 1 つのジョブで続けて行うと、上げた直後のアーティファクトを公開の手順が見つけられず
# （"No artifacts named github-pages were found"）、ときどき失敗していた（2026-11-25）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
